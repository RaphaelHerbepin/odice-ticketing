query ticketStatisticsAgents(
  $from: ISO8601DateTime
  $to: ISO8601DateTime
  $axisFilters: [TicketStatisticsAxisFilterInput!]
) {
  ticketStatisticsAgents(from: $from, to: $to, axisFilters: $axisFilters) {
    id
    label
    open
    escalated
    dormant
    received
    closed
    averageFirstResponseMinutes
    averageCloseMinutes
    closeInTimePercent
    timeLoggedMinutes
  }
}
