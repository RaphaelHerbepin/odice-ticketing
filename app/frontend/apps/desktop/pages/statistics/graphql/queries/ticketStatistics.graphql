query ticketStatistics(
  $from: ISO8601DateTime
  $to: ISO8601DateTime
  $groupIds: [ID!]
  $organizationIds: [ID!]
  $axes: [String!]
  $interval: String
) {
  ticketStatistics(
    from: $from
    to: $to
    groupIds: $groupIds
    organizationIds: $organizationIds
    axes: $axes
    interval: $interval
  ) {
    period {
      from
      to
      interval
    }
    totals {
      total
      open
      closed
      escalated
      averageFirstResponseMinutes
      averageCloseMinutes
      firstResponseInTimePercent
      closeInTimePercent
      timeLoggedMinutes
      timeCoveragePercent
    }
    byGroup {
      label
      count
    }
    byOrganization {
      label
      count
    }
    byState {
      label
      count
    }
    byPriority {
      label
      count
    }
    byOwner {
      label
      count
    }
    byChannel {
      label
      count
    }
    byAxis {
      name
      label
      buckets {
        value
        label
        count
      }
    }
    volumeOverTime {
      date
      created
      closed
      timeLoggedMinutes
    }
  }
}
