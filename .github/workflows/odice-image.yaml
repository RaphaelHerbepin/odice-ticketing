# Odice — construction et publication de l'image applicative.
#
# Pourquoi la CI et pas un build local : `assets:precompile` fait tourner
# rolldown, un binaire natif Rust. Le construire pour linux/amd64 depuis un Mac
# Apple Silicon passe par l'émulation QEMU — 30 à 60 minutes, avec des SIGSEGV.
# Un runner `ubuntu-24.04` est nativement amd64 : le build y est direct.
#
# Ce workflow est un fichier NOUVEAU : il n'entre pas en conflit avec les
# workflows amont (`ci.yaml`, `docker-ci.yaml`, `docker-release.yaml`,
# `packager.io.yaml`), qui restent inchangés.

name: Odice — image

on:
  push:
    branches: [odice/main]
  workflow_dispatch:

# Volontairement PAS de concurrence au niveau du workflow : elle s'appliquerait
# aussi au déploiement, qu'il ne faut jamais interrompre. Chaque job porte donc
# la sienne.

jobs:
  # Barrière minimale, et volontairement minimale.
  #
  # La suite Zammad complète demande plus de quarante minutes, une base et une
  # image dédiée : la mettre sur le chemin de chaque push garantirait qu'on la
  # contourne. Ce qui suit tient sur un runner nu, sans Ruby ni base, en cinq à
  # sept minutes — donc EN PARALLÈLE du build, sans allonger le délai.
  #
  # Ce que ces contrôles n'attraperont pas : une régression purement visuelle.
  # C'est le rôle du staging, qu'on regarde avant de poser une étiquette.
  checks:
    runs-on: ubuntu-24.04
    # Annulable : un contrôle sur un commit dépassé n'apprend rien.
    concurrency:
      group: odice-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire au diff avec le commit précédent, plus bas.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Le dépôt ne porte pas de .node-version ; la contrainte vit dans
          # package.json (engines.node >= 24).
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm lint:ts

      # `vitest run` et non `pnpm test` : ce dernier lance vitest en mode veille,
      # qui ne rend jamais la main sur un runner. Les chemins sont relatifs à
      # `app/frontend`, racine déclarée par la configuration Vitest.
      - name: Tests des pages Odice
        run: pnpm exec vitest run apps/desktop/pages/statistics

      - name: Feuilles de style Odice
        run: make lint-odice

      - name: ESLint sur les fichiers modifiés
        run: |
          set -o pipefail
          BASE='${{ github.event.before }}'
          # Premier push sur une branche, ou push forcé : pas de base
          # exploitable, on ne lint alors que ce que porte le commit.
          if [ -z "${BASE}" ] || [ "${BASE}" = '0000000000000000000000000000000000000000' ] \
             || ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          FILES="$(git diff --name-only --diff-filter=d "${BASE}" "${{ github.sha }}" \
                    -- 'app/frontend/**/*.ts' 'app/frontend/**/*.vue' || true)"
          if [ -z "${FILES}" ]; then
            echo "Aucun fichier frontend modifié."
            exit 0
          fi
          echo "${FILES}" | tr '\n' ' '
          echo "${FILES}" | xargs pnpm exec eslint

  build:
    runs-on: ubuntu-24.04
    # Annulable : l'image d'un commit dépassé ne sera pas déployée.
    concurrency:
      group: odice-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}

    steps:
      - uses: actions/checkout@v4

      # Le Dockerfile écrit « <VERSION>-<sha8>.docker » dans le fichier VERSION.
      # Taguer l'image avec la même chaîne fait correspondre exactement le tag et
      # la version affichée dans Administration → Version : depuis un ticket de
      # support, on remonte au commit.
      - name: Calculer les identifiants de version
        id: meta
        run: |
          echo "sha8=$(echo '${{ github.sha }}' | cut -c 1-8)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"
          # GHCR n'accepte que des chemins en minuscules ; le nom d'utilisateur
          # GitHub, lui, peut porter des majuscules.
          echo "repo=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Obligatoire : le Dockerfile sort en erreur si COMMIT_SHA est absent.
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}
            ${{ steps.meta.outputs.repo }}:odice-main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Déploiement en RECETTE. La production, elle, part d'une étiquette de version
  # et passe par odice-release.yaml.
  #
  # Volontairement `needs: build` seul, et non `needs: [build, checks]` : la
  # staging sert justement à regarder ce qui vient d'être écrit, y compris quand
  # un contrôle échoue. La barrière est sur le chemin de la production.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    # JAMAIS annulable, et c'est le point important.
    #
    # Un `docker compose up -d` interrompu laisse la pile à mi-chemin : c'est
    # ainsi que le conteneur nginx de production s'est retrouvé « Created » et
    # jamais démarré, site injoignable, alors que tout le reste tournait. Le
    # déploiement suivant attend donc son tour au lieu de tuer le précédent.
    concurrency:
      group: odice-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Déployer sur le staging
        env:
          DEPLOY_HOST: ${{ secrets.ODICE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ODICE_DEPLOY_USER }}
          # Clé distincte de celle de la production : sa commande forcée ne peut
          # lancer que odice-deploy-staging. Une fuite de ce secret ne permet
          # donc pas d'atteindre la production.
          DEPLOY_KEY: ${{ secrets.ODICE_DEPLOY_KEY_STAGING || secrets.ODICE_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ODICE_DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -o errexit

          # Un secret est saisi à la main : un espace de fin ou un retour
          # chariot collé depuis Windows y survit sans être visible, et
          # `ssh-keygen -F` compare la chaîne brute — « srv.example.com » et
          # « srv.example.com » suivi d'un espace sont deux hôtes différents
          # pour lui. Un nom d'hôte ne contient jamais de blanc : les retirer
          # tous est sans risque et supprime toute une classe de faux échecs.
          DEPLOY_HOST="$(printf '%s' "${DEPLOY_HOST}" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "${DEPLOY_USER}" | tr -d '[:space:]')"

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_KEY}" ]; then
            echo "Déploiement non configuré : secrets ODICE_DEPLOY_* absents."
            echo "Voir contrib/odice/BASCULE.md, section « Déploiement continu »."
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Empreinte épinglée : sans elle, la première connexion accepterait
          # n'importe quel serveur se présentant à cette adresse.
          if [ -z "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "::error::ODICE_DEPLOY_KNOWN_HOSTS est vide — connexion refusée."
            echo "  Sur le serveur : ssh-keyscan \"\$ODICE_DEPLOY_HOST\""
            exit 1
          fi
          # Même précaution sur le relevé : des fins de ligne Windows y
          # laisseraient un \r collé à la clé, que OpenSSH refuse en silence.
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # L'entrée doit porter EXACTEMENT le nom utilisé pour se connecter.
          # Un relevé fait sur « votre-serveur » ne vaut pas pour une IP, ni
          # l'inverse : OpenSSH compare la chaîne, il ne résout rien. Sans ce
          # contrôle, l'échec ne dit que « Host key verification failed », ce
          # qui n'oriente vers rien.
          if ! ssh-keygen -F "${DEPLOY_HOST}" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::Aucune entrée known_hosts pour l'hôte configuré."
            echo "  ODICE_DEPLOY_KNOWN_HOSTS doit être relevé avec la valeur"
            echo "  EXACTE de ODICE_DEPLOY_HOST :"
            echo ""
            echo "      ssh-keyscan <valeur exacte de ODICE_DEPLOY_HOST>"
            echo ""
            # `ssh-keyscan` intercale des lignes de commentaire « # host:22 SSH-2.0… » :
            # les afficher parmi les entrées rendait la liste illisible.
            echo "  Noms présents dans le secret actuel :"
            grep -v '^#' ~/.ssh/known_hosts | cut -d' ' -f1 | sort -u | sed 's/^/    /'
            echo "  Types de clés : $(grep -v '^#' ~/.ssh/known_hosts | cut -d' ' -f2 | sort -u | tr '\n' ' ')"
            echo ""
            echo "  Le nom ci-dessus doit correspondre EXACTEMENT à ODICE_DEPLOY_HOST."
            echo "  Une entrée « [hôte]:22 » ne vaut pas pour « hôte » sans port."
            echo ""
            # GitHub masque la valeur d'un secret dans les logs, mais pas sa
            # longueur : deux chaînes qui s'affichent pareil et dont le compte
            # de caractères diffère désignent un caractère invisible. C'est le
            # seul indice exploitable sans divulguer le secret.
            echo "  Longueur de ODICE_DEPLOY_HOST : ${#DEPLOY_HOST} caractères."
            grep -v '^#' ~/.ssh/known_hosts | cut -d' ' -f1 | sort -u | while read -r entry; do
              echo "  Longueur de l'entrée relevée  : ${#entry} caractères."
            done
            echo "  Des longueurs différentes pour un même nom affiché"
            echo "  signalent un caractère invisible dans l'un des deux secrets."
            exit 1
          fi

          # Le tag est transmis comme commande SSH ; la clé porte côté serveur
          # une commande forcée qui ne peut lancer que ci-deploy-entry.sh, lequel
          # le valide avant tout usage.
          # La clé porte côté serveur une commande forcée qui ne peut lancer que
          # odice-deploy-production : l'environnement n'est pas transmis ici.
          #
          # `-4` : les runners GitHub n'ont pas d'IPv6 sortant, et un nom qui
          # résout en AAAA donne « Network is unreachable » après deux minutes
          # d'attente. Forcer IPv4 supprime cette classe d'échec.
          #
          # Trois tentatives, et seulement sur échec de CONNEXION : une
          # coupure réseau passagère ne doit pas réclamer une relance à la
          # main. Le code 255 est celui de ssh lui-même ; tout autre code vient
          # du script distant, qui a donc bien été atteint — le rejouer
          # risquerait de déployer deux fois.
          # La sortie du script distant est conservée : elle seule dit quelle pile
          # a réellement été servie. Voir le contrôle d'arrivée après la boucle.
          JOURNAL="${RUNNER_TEMP}/deploiement.log"

          for tentative in 1 2 3; do
            set +o errexit
            ssh -4 -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "${DEPLOY_USER:-raphael}@${DEPLOY_HOST}" "${TAG}" 2>&1 | tee "${JOURNAL}"
            # Le code de ssh, pas celui de tee : sans PIPESTATUS, un échec du
            # script distant passerait pour un succès.
            CODE=${PIPESTATUS[0]}
            set -o errexit

            [ "${CODE}" -eq 0 ] && break
            if [ "${CODE}" -ne 255 ] || [ "${tentative}" -eq 3 ]; then
              echo "::error::le déploiement a échoué (code ${CODE})."
              exit "${CODE}"
            fi
            echo "connexion impossible (tentative ${tentative}/3), nouvelle tentative dans 20 s…"
            sleep 20
          done

          # CONTRÔLE D'ARRIVÉE.
          #
          # L'environnement est choisi par la commande forcée de la clé SSH,
          # côté serveur : ce workflow ne le décide pas, il ne peut que le
          # constater. C'est une bonne propriété — une clé ne sait servir que sa
          # propre pile — mais elle a un angle mort : si le secret contient la
          # clé privée de l'AUTRE pile, l'autre pile est déployée et le job se
          # conclut en vert.
          #
          # Ce n'est pas une hypothèse. Le 25/09/2026, le job « production » a
          # déployé le staging et rapporté un succès ; ses propres logs
          # disaient « [staging] déploiement terminé », et rien ne les lisait.
          #
          # `say()`, dans ci-deploy-common.sh, estampille chaque ligne de
          # l'environnement qu'elle sert. C'est cette trace que l'on exige.
          if ! grep -q '\[staging\]' "${JOURNAL}"; then
            echo "::error::le script distant n'a pas servi la RECETTE."
            echo "  Environnement(s) annoncé(s) : $(grep -o '\[[a-z]*\]' "${JOURNAL}" | sort -u | tr '\n' ' ')"
            echo "  ODICE_DEPLOY_KEY_STAGING contient probablement la clé privée d'une autre pile."
            echo "  Les empreintes attendues se relèvent ainsi, sur le serveur :"
            echo "      ssh-keygen -lf ~/.ssh/authorized_keys"
            exit 1
          fi

          echo "### Déployé : \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
