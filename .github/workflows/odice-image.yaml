# Odice — construction et publication de l'image applicative.
#
# Pourquoi la CI et pas un build local : `assets:precompile` fait tourner
# rolldown, un binaire natif Rust. Le construire pour linux/amd64 depuis un Mac
# Apple Silicon passe par l'émulation QEMU — 30 à 60 minutes, avec des SIGSEGV.
# Un runner `ubuntu-24.04` est nativement amd64 : le build y est direct.
#
# Ce workflow est un fichier NOUVEAU : il n'entre pas en conflit avec les
# workflows amont (`ci.yaml`, `docker-ci.yaml`, `docker-release.yaml`,
# `packager.io.yaml`), qui restent inchangés.

name: Odice — image

on:
  push:
    branches: [odice/main]
  workflow_dispatch:

concurrency:
  group: odice-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Le Dockerfile écrit « <VERSION>-<sha8>.docker » dans le fichier VERSION.
      # Taguer l'image avec la même chaîne fait correspondre exactement le tag et
      # la version affichée dans Administration → Version : depuis un ticket de
      # support, on remonte au commit.
      - name: Calculer les identifiants de version
        id: meta
        run: |
          echo "sha8=$(echo '${{ github.sha }}' | cut -c 1-8)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"
          # GHCR n'accepte que des chemins en minuscules ; le nom d'utilisateur
          # GitHub, lui, peut porter des majuscules.
          echo "repo=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Obligatoire : le Dockerfile sort en erreur si COMMIT_SHA est absent.
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}
            ${{ steps.meta.outputs.repo }}:odice-main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}"
            echo '```'
            echo ''
            echo "Sur le VPS : renseigner \`ODICE_IMAGE_REPO\` et \`ODICE_IMAGE_TAG\` dans \`.env\`, puis \`make up\`."
          } >> "$GITHUB_STEP_SUMMARY"
