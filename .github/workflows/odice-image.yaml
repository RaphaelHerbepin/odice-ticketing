# Odice — construction et publication de l'image applicative.
#
# Pourquoi la CI et pas un build local : `assets:precompile` fait tourner
# rolldown, un binaire natif Rust. Le construire pour linux/amd64 depuis un Mac
# Apple Silicon passe par l'émulation QEMU — 30 à 60 minutes, avec des SIGSEGV.
# Un runner `ubuntu-24.04` est nativement amd64 : le build y est direct.
#
# Ce workflow est un fichier NOUVEAU : il n'entre pas en conflit avec les
# workflows amont (`ci.yaml`, `docker-ci.yaml`, `docker-release.yaml`,
# `packager.io.yaml`), qui restent inchangés.

name: Odice — image

on:
  push:
    branches: [odice/main]
  workflow_dispatch:

concurrency:
  group: odice-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}

    steps:
      - uses: actions/checkout@v4

      # Le Dockerfile écrit « <VERSION>-<sha8>.docker » dans le fichier VERSION.
      # Taguer l'image avec la même chaîne fait correspondre exactement le tag et
      # la version affichée dans Administration → Version : depuis un ticket de
      # support, on remonte au commit.
      - name: Calculer les identifiants de version
        id: meta
        run: |
          echo "sha8=$(echo '${{ github.sha }}' | cut -c 1-8)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"
          # GHCR n'accepte que des chemins en minuscules ; le nom d'utilisateur
          # GitHub, lui, peut porter des majuscules.
          echo "repo=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Obligatoire : le Dockerfile sort en erreur si COMMIT_SHA est absent.
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}
            ${{ steps.meta.outputs.repo }}:odice-main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha8 }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Déploiement déclenché par la CI plutôt que par une interrogation périodique
  # du serveur : la mise en production suit immédiatement la construction, et il
  # n'y a qu'un seul endroit où lire ce qui s'est passé.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Déployer sur le serveur
        env:
          DEPLOY_HOST: ${{ secrets.ODICE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ODICE_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ODICE_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ODICE_DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -o errexit
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_KEY}" ]; then
            echo "Déploiement non configuré : secrets ODICE_DEPLOY_* absents."
            echo "Voir contrib/odice/BASCULE.md, section « Déploiement continu »."
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Empreinte épinglée : sans elle, la première connexion accepterait
          # n'importe quel serveur se présentant à cette adresse.
          if [ -z "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "::error::ODICE_DEPLOY_KNOWN_HOSTS est vide — connexion refusée."
            echo "  Sur le serveur : ssh-keyscan \"\$ODICE_DEPLOY_HOST\""
            exit 1
          fi
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # L'entrée doit porter EXACTEMENT le nom utilisé pour se connecter.
          # Un relevé fait sur « srv1943441 » ne vaut pas pour une IP, ni
          # l'inverse : OpenSSH compare la chaîne, il ne résout rien. Sans ce
          # contrôle, l'échec ne dit que « Host key verification failed », ce
          # qui n'oriente vers rien.
          if ! ssh-keygen -F "${DEPLOY_HOST}" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::Aucune entrée known_hosts pour l'hôte configuré."
            echo "  ODICE_DEPLOY_KNOWN_HOSTS doit être relevé avec la valeur"
            echo "  EXACTE de ODICE_DEPLOY_HOST :"
            echo ""
            echo "      ssh-keyscan <valeur exacte de ODICE_DEPLOY_HOST>"
            echo ""
            # `ssh-keyscan` intercale des lignes de commentaire « # host:22 SSH-2.0… » :
            # les afficher parmi les entrées rendait la liste illisible.
            echo "  Noms présents dans le secret actuel :"
            grep -v '^#' ~/.ssh/known_hosts | cut -d' ' -f1 | sort -u | sed 's/^/    /'
            echo "  Types de clés : $(grep -v '^#' ~/.ssh/known_hosts | cut -d' ' -f2 | sort -u | tr '\n' ' ')"
            echo ""
            echo "  Le nom ci-dessus doit correspondre EXACTEMENT à ODICE_DEPLOY_HOST."
            echo "  Une entrée « [hôte]:22 » ne vaut pas pour « hôte » sans port."
            exit 1
          fi

          # Le tag est transmis comme commande SSH ; la clé porte côté serveur
          # une commande forcée qui ne peut lancer que ci-deploy-entry.sh, lequel
          # le valide avant tout usage.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${DEPLOY_USER:-raphael}@${DEPLOY_HOST}" "${TAG}"

          echo "### Déployé : \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
