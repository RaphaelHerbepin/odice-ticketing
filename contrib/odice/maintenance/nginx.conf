server {
  listen 80 default_server;

  # 503, et non 200 ni 302. Un 200 ferait mémoriser la page de maintenance
  # comme étant le site — par les moteurs de recherche, par les caches, et par
  # les sondes de supervision, qui n'alerteraient pas. Le 503 dit exactement ce
  # qui se passe : indisponible, temporairement.
  add_header Retry-After 600 always;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  # Marqueur vérifiable : maintenance.sh attend de le voir avant d'autoriser le
  # déploiement. Sans lui, un 503 quelconque de nginx-proxy passerait pour la
  # page de maintenance.
  add_header X-Odice-Maintenance 1 always;

  location = /maintenance.html {
    root /usr/share/nginx/html;
    internal;
  }

  # Tout, y compris /api et le websocket. C'est voulu : les onglets d'agents
  # ouverts afficheront des erreurs réseau, puis rechargeront la nouvelle
  # version au retour.
  location / { return 503; }

  error_page 503 /maintenance.html;
}
